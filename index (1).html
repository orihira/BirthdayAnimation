<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎁 For You</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05020f;color:#fff;
  font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none;touch-action:manipulation}
canvas.gl{position:fixed;inset:0;z-index:0}
#start{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle,#05020f00 0%,#05020fb0 80%);cursor:pointer;padding:20px}
#start h1{font-size:clamp(30px,9vw,64px);margin:0 0 .3em;text-shadow:0 0 25px #ff6fa5,0 0 70px #9b5de5;letter-spacing:.05em}
#start p{opacity:.85;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:42vmin;font-weight:900;z-index:20;
  pointer-events:none;opacity:0;text-shadow:0 0 40px #ff6fa5,0 0 110px #9b5de5}
#big.go{animation:bigpop .9s ease-out}
@keyframes bigpop{0%{opacity:0;transform:scale(3)}22%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.6)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#flash.go{animation:fl 1.3s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translate(0)}20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-8px,-6px)}80%{transform:translate(6px,8px)}}
#sub{position:fixed;left:0;right:0;bottom:19vh;text-align:center;z-index:20;padding:0 7vw;font-size:clamp(15px,3.8vmin,28px);line-height:1.8;white-space:pre-wrap;
  opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s;pointer-events:none;
  text-shadow:0 0 14px #ff6fa5,0 0 30px #9b5de588,0 2px 6px #000}
#sub.on{opacity:1;transform:none}
#hint{position:fixed;bottom:11vh;left:0;right:0;text-align:center;z-index:20;opacity:0;transition:opacity .6s;font-size:14px;letter-spacing:.12em;pointer-events:none;text-shadow:0 0 12px #000}
#hint.on{opacity:.85}
#again{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);z-index:21;display:none;font:inherit;color:#fff;border:0;border-radius:999px;
  padding:12px 28px;background:linear-gradient(135deg,#ff6fa5,#9b5de5);box-shadow:0 6px 24px #000a;cursor:pointer}
#mute{position:fixed;top:14px;right:14px;z-index:40;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:18px;display:none;cursor:pointer}
/* editor */
#editor{position:fixed;inset:0;z-index:200;background:#12082a;overflow:auto;padding:20px;display:none}
#editor.on{display:block}
#editor .w{max-width:560px;margin:0 auto}
#editor label{display:block;margin:16px 0 6px;font-weight:bold}
#editor input,#editor textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #fff4;background:#ffffff14;color:#fff;font:inherit;user-select:text}
#editor textarea{min-height:120px}
#editor button{font:inherit;color:#fff;border:0;border-radius:999px;padding:10px 22px;background:linear-gradient(135deg,#ff6fa5,#9b5de5);cursor:pointer;margin-right:6px}
#out{word-break:break-all;font-size:12px;opacity:.9;margin-top:12px;user-select:text}
small{opacity:.7}
</style>
</head>
<body>

<!-- ================================================================
  ★ここを書き換えるだけでOK★（GitHubのウェブ画面で鉛筆アイコンから編集できます）

<script>
const CONFIG = {
  name: "〇〇",            // 相手の名前（例: "さくら"）
  from: "より",            // 自分の名前（例: "ゆうた"）
  messages: [              // 1行が1ページ。増やしても減らしてもOK。\n で改行
                           // 「大きい文字|下に出る小さい説明（サブタイトル）」のように | で区切ると説明も付けられる
    "お誕生日おめでとう！|今日は君が主役の日だよ",
    "いつも仲良くしてくれて\nありがとう",
    "これからも\nよろしくね！"
  ],
  final: "生まれてきてくれて\nありがとう！",   // 最後の大きなメッセージ
  finalSub: "🎁 プレゼントは〇〇だよ！\n次に会ったときに渡すね（ここに誕プレの説明を書く）"   // 最後に下に出るサブタイトル（誕プレの説明など）。不要なら ""
};
</script>

<div id="start"><h1 id="st_t">🎁 For You</h1><p>🔊 音が出るよ　タップしてスタート</p></div>
<div id="big"></div>
<div id="flash"></div>
<div id="sub"></div>
<div id="hint"></div>
<button id="mute">🔊</button>

<!-- エディタ（?edit で表示） -->
<div id="editor"><div class="w">
  <h2>🛠 メッセージ作成</h2>
  <small>入力して「リンクを作る」を押すと、メッセージ入りのURLができます。そのURLを友達に送ればOK。</small>
  <label>相手の名前</label><input id="e_name" placeholder="さくら">
  <label>自分の名前</label><input id="e_from" placeholder="ゆうた">
  <label>メッセージ（1行＝1ページ）</label>
  <small>「大きい文字|下に出る小さい説明」のように | で区切ると、サブタイトルも付けられます。文字の途中で改行したいときは \n と書いてね。</small>
  <textarea id="e_msgs" placeholder="お誕生日おめでとう！|今日は君が主役の日だよ&#10;いつもありがとう！"></textarea>
  <label>最後の大きなメッセージ</label>
  <textarea id="e_final" placeholder="生まれてきてくれてありがとう！"></textarea>
  <label>最後のサブタイトル（誕プレの説明など）</label>
  <textarea id="e_fsub" placeholder="🎁 プレゼントは〇〇だよ！次に会ったときに渡すね"></textarea>
  <p><button id="e_make">リンクを作る</button><button id="e_copy">コピー</button><button id="e_open">プレビュー</button></p>
  <div id="out"></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s))));
const unesc=s=>String(s).replace(/\\n/g,"\n");
let cfg=Object.assign({},CONFIG);
const hm=location.hash.match(/d=([^&]+)/);
if(hm){try{cfg=Object.assign(cfg,dec(decodeURIComponent(hm[1])));}catch(e){}}
const NAME=cfg.name;
const rawMsgs=()=>(Array.isArray(cfg.messages)?cfg.messages.slice():String(cfg.messages).split("\n")).filter(s=>String(s).trim());
const msgList=()=>rawMsgs().map(unesc);
const parseMsg=s=>{const i=s.indexOf("|");return i<0?[s.trim(),""]:[s.slice(0,i).trim(),s.slice(i+1).trim()]};
$("st_t").textContent="🎁 For "+NAME;

/* ================= エディタ ================= */
if(/[?&]edit\b/.test(location.search)){
  $("editor").classList.add("on"); $("start").style.display="none";
  $("e_name").value=cfg.name==="〇〇"?"":cfg.name; $("e_from").value=cfg.from==="より"?"":cfg.from;
  $("e_msgs").value=rawMsgs().map(s=>s.replace(/\n/g,"\\n")).join("\n");
  $("e_final").value=unesc(cfg.final||""); $("e_fsub").value=unesc(cfg.finalSub||"");
  let url="";
  const make=()=>{
    const o={name:$("e_name").value.trim()||"あなた",from:$("e_from").value.trim(),
      messages:$("e_msgs").value.split("\n").map(s=>s.trim()).filter(Boolean),
      final:$("e_final").value,finalSub:$("e_fsub").value};
    url=location.origin+location.pathname+"#d="+encodeURIComponent(enc(o)); $("out").textContent=url;
  };
  $("e_make").onclick=make;
  $("e_copy").onclick=()=>{if(!url)make();navigator.clipboard.writeText(url).then(()=>alert("コピーしたよ！"),()=>prompt("コピーしてね",url));};
  $("e_open").onclick=()=>{if(!url)make();window.open(url,"_blank");};
  return;
}
if(typeof THREE==="undefined"){
  $("start").innerHTML='<p style="padding:30px">ネットに接続してから開いてね（3Dライブラリが読み込めませんでした）</p>'; return;
}

/* ================= 音（WebAudioで合成） ================= */
let AC=null,master,noiseBuf,muted=false;
function initAudio(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value=.7; master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==="suspended")AC.resume();
  }catch(e){AC=null}
}
function tone(f,t0,dur,type,vol,f2){
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.3,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.05);
}
function noise(t0,dur,vol,freq,type){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur);
}
const sfx={
  tick(){if(!AC)return;tone(880,AC.currentTime,.18,"square",.12)},
  boom(){if(!AC)return;const t=AC.currentTime;tone(130,t,1,"sine",.9,28);noise(t,.9,.6,500)},
  pop(){if(!AC)return;const t=AC.currentTime;noise(t,.4,.22,1600+Math.random()*1800,"bandpass");tone(260+Math.random()*200,t,.25,"triangle",.1,70)},
  whoosh(){if(!AC)return;const t=AC.currentTime;tone(380,t,.8,"sawtooth",.035,1500);noise(t,.7,.06,3000,"bandpass")},
  riser(d){if(!AC)return;const t=AC.currentTime;tone(70,t,d,"sawtooth",.16,1500);tone(140,t,d,"square",.05,3000)},
  chime(){if(!AC)return;const t=AC.currentTime;tone(1046,t,.5,"sine",.15);tone(1568,t+.08,.6,"sine",.12)},
  melody(){
    if(!AC)return;
    const N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
    const seq=[["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],
               ["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],
               ["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",1],
               ["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2]];
    let t=AC.currentTime+.1; const beat=.46;
    for(const [n,b] of seq){tone(N[n],t,b*beat*1.7,"sine",.26);tone(N[n]*2,t,b*beat,"sine",.07);t+=b*beat}
  }
};

/* ---- ビート（キック・ハイハット・ベース。キックに合わせて画面も脈打つ） ---- */
let beatOn=false,beatNext=0,beatStep=0,pulse=0;
const STEP=60/128/4;
function beatStart(){
  if(!AC||beatOn)return; beatOn=true; beatNext=AC.currentTime+.05; beatStep=0;
  setInterval(()=>{
    while(beatNext<AC.currentTime+.15){
      const s=beatStep%16,t=beatNext;
      if(s%4===0){tone(150,t,.3,"sine",.85,40);setTimeout(()=>{pulse=1},Math.max(0,(t-AC.currentTime)*1000))}
      if(s===4||s===12)noise(t,.16,.28,1800,"bandpass");
      if(s%2===1)noise(t,.05,.1,7000,"highpass");
      if(s===0||s===6||s===10)tone(s===10?98:65.41,t,.22,"sawtooth",.1);
      beatNext+=STEP; beatStep++;
    }
  },25);
}

/* ================= three.js 基本 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.domElement.className="gl"; document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05020f);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,3000); camera.position.set(0,0,70);
let camZ=70,fovX=0;
function punch(a){fovX=Math.max(fovX,a)}

function makeSprite(){
  const c=document.createElement("canvas"); c.width=c.height=64; const g=c.getContext("2d");
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.3,"rgba(255,255,255,.7)"); gr.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
}
const tex=makeSprite();
const FONT='"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif';
const C_PINK=new THREE.Color("#ff6fa5"),C_GOLD=new THREE.Color("#ffd166"),C_CYAN=new THREE.Color("#6ec6ff");
function grad(u,out){u=Math.max(0,Math.min(1,u));if(u<.5)out.copy(C_PINK).lerp(C_GOLD,u*2);else out.copy(C_GOLD).lerp(C_CYAN,(u-.5)*2);return out}

/* ---- ワープ用の星（線） ---- */
const SN=1100, sPos=new Float32Array(SN*6), sx=new Float32Array(SN), sy=new Float32Array(SN), sz=new Float32Array(SN);
function resetStar(i,far){sx[i]=(Math.random()-.5)*400;sy[i]=(Math.random()-.5)*400;sz[i]=far?-900+Math.random()*970:-900}
for(let i=0;i<SN;i++)resetStar(i,true);
const sGeo=new THREE.BufferGeometry(); sGeo.setAttribute("position",new THREE.BufferAttribute(sPos,3));
const sMat=new THREE.LineBasicMaterial({color:0xbfd8ff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false});
const stars=new THREE.LineSegments(sGeo,sMat); stars.frustumCulled=false; scene.add(stars);
let warpSpeed=1.2;
function updateStars(k){
  const len=warpSpeed*1.6+.6;
  for(let i=0;i<SN;i++){
    sz[i]+=warpSpeed*k; if(sz[i]>70)resetStar(i,false);
    const j=i*6; sPos[j]=sx[i];sPos[j+1]=sy[i];sPos[j+2]=sz[i]; sPos[j+3]=sx[i];sPos[j+4]=sy[i];sPos[j+5]=sz[i]-len;
  }
  sGeo.attributes.position.needsUpdate=true;
}

/* ---- メインの粒（文字に変形） ---- */
const N=innerWidth<700?5500:9000;
const pos=new Float32Array(N*3),vel=new Float32Array(N*3),tgt=new Float32Array(N*3),col=new Float32Array(N*3),tcol=new Float32Array(N*3),spr=new Float32Array(N),ph=new Float32Array(N);
for(let i=0;i<N;i++){
  const a=Math.random()*Math.PI*2,u=Math.random()*2-1,r=Math.sqrt(1-u*u),R=60+Math.random()*90;
  pos[i*3]=r*Math.cos(a)*R; pos[i*3+1]=u*R; pos[i*3+2]=r*Math.sin(a)*R-60;
  spr[i]=.012+Math.random()*.018; ph[i]=Math.random()*6.283;
  col[i*3]=col[i*3+1]=col[i*3+2]=0; tgt[i*3]=pos[i*3];tgt[i*3+1]=pos[i*3+1];tgt[i*3+2]=pos[i*3+2];
}
const geo=new THREE.BufferGeometry();
geo.setAttribute("position",new THREE.BufferAttribute(pos,3)); geo.setAttribute("color",new THREE.BufferAttribute(col,3));
const mat=new THREE.PointsMaterial({size:1,map:tex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; pts.visible=false;
const pgroup=new THREE.Group(); pgroup.add(pts); scene.add(pgroup);

/* ---- 花火・紙吹雪の粒 ---- */
const FN=12000,fpos=new Float32Array(FN*3),fvel=new Float32Array(FN*3),fcol=new Float32Array(FN*3),fbase=new Float32Array(FN*3),
      flife=new Float32Array(FN),fg=new Float32Array(FN),fd=new Float32Array(FN);
for(let i=0;i<FN;i++){fpos[i*3+1]=-9999}
const fGeo=new THREE.BufferGeometry(); fGeo.setAttribute("position",new THREE.BufferAttribute(fpos,3)); fGeo.setAttribute("color",new THREE.BufferAttribute(fcol,3));
const fMat=new THREE.PointsMaterial({size:2,map:tex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
const fpts=new THREE.Points(fGeo,fMat); fpts.frustumCulled=false; scene.add(fpts);
let fi=0; const tmpC=new THREE.Color();
function spawn(x,y,z,vx,vy,vz,life,c,g,d){
  const i=(fi++)%FN,j=i*3; fpos[j]=x;fpos[j+1]=y;fpos[j+2]=z; fvel[j]=vx;fvel[j+1]=vy;fvel[j+2]=vz;
  flife[i]=life; fbase[j]=c.r;fbase[j+1]=c.g;fbase[j+2]=c.b; fg[i]=g; fd[i]=d;
}
function burst(x,y,z,opt){
  sfx.pop(); opt=opt||{};
  const hue=opt.hue!=null?opt.hue:Math.random(), n=opt.n||280, kind=opt.kind||(["sphere","sphere","ring","willow"][Math.random()*4|0]);
  const sp0=opt.speed||(22+Math.random()*12), multi=Math.random()<.4;
  for(let k=0;k<n;k++){
    tmpC.setHSL((hue+(multi?Math.random()*.15:0))%1,.9,.6);
    let vx,vy,vz; const th=Math.random()*6.283;
    if(kind==="ring"){const s=sp0*(.9+Math.random()*.2);vx=Math.cos(th)*s;vy=Math.sin(th)*s*.3;vz=Math.sin(th)*s*.9;}
    else{const u=Math.random()*2-1,r=Math.sqrt(1-u*u),s=sp0*(.45+Math.random()*.55);vx=r*Math.cos(th)*s;vy=u*s;vz=r*Math.sin(th)*s;}
    spawn(x,y,z,vx,vy,vz,(kind==="willow"?2.6:1.5)+Math.random()*.8,tmpC,kind==="willow"?12:8,.965);
  }
}
function confetti3d(n){
  for(let k=0;k<n;k++){
    tmpC.setHSL(Math.random(),.9,.62);
    spawn((Math.random()-.5)*visW*1.2,visH*.7+Math.random()*30,(Math.random()-.5)*50,(Math.random()-.5)*5,-6-Math.random()*8,(Math.random()-.5)*5,5+Math.random()*3,tmpC,1.2,.995);
  }
}
function updateFW(dt){
  const k=dt*60;
  for(let i=0;i<FN;i++){
    const j=i*3;
    if(flife[i]<=0){fcol[j]=fcol[j+1]=fcol[j+2]=0;continue}
    flife[i]-=dt; const d=Math.pow(fd[i],k);
    fvel[j]*=d;fvel[j+1]=fvel[j+1]*d-fg[i]*dt;fvel[j+2]*=d;
    fpos[j]+=fvel[j]*dt;fpos[j+1]+=fvel[j+1]*dt;fpos[j+2]+=fvel[j+2]*dt;
    const f=Math.max(0,Math.min(1,flife[i]*1.2));
    fcol[j]=fbase[j]*f;fcol[j+1]=fbase[j+1]*f;fcol[j+2]=fbase[j+2]*f;
  }
  fGeo.attributes.position.needsUpdate=true; fGeo.attributes.color.needsUpdate=true;
}
/* ロケットが尾を引いて昇って、てっぺんで爆発 */
const shells=[];
function launch(opt){
  sfx.whoosh();
  const z=-60-Math.random()*110, dist=70-z, h=2*dist*Math.tan(THREE.MathUtils.degToRad(35)), w=h*(innerWidth/innerHeight);
  const x=(Math.random()-.5)*w*.85, y0=-h*.6, yT=(Math.random()*.5-.05)*h, tt=.8+Math.random()*.5;
  shells.push({x,y:y0,z,vy:(yT-y0)/tt,yT,opt});
}
function updateShells(dt){
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i]; s.y+=s.vy*dt;
    tmpC.setRGB(1,.8,.45);
    for(let k=0;k<3;k++)spawn(s.x+(Math.random()-.5)*.6,s.y,s.z,(Math.random()-.5)*2,-Math.random()*6,(Math.random()-.5)*2,.45+Math.random()*.4,tmpC,3,.95);
    if(s.y>=s.yT){burst(s.x,s.y,s.z,s.opt);punch(3);shells.splice(i,1)}
  }
}
function randBurst(opt){launch(opt)}
let autoFW=null;
function autoFireworks(on){clearInterval(autoFW);if(on)autoFW=setInterval(()=>randBurst(),380)}

/* ---- 衝撃波リング ---- */
const ringGeo=new THREE.RingGeometry(.93,1,96), rings=[];
function shockwave(color){
  const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:color||0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.z=10; m.userData.t=0; scene.add(m); rings.push(m);
}
function updateRings(dt){
  for(let i=rings.length-1;i>=0;i--){
    const m=rings[i]; m.userData.t+=dt; const p=m.userData.t/1.1;
    m.scale.setScalar(2+p*150); m.material.opacity=Math.max(0,1-p);
    if(p>=1){scene.remove(m);m.material.dispose();rings.splice(i,1)}
  }
}

/* ================= 文字 → 粒 ================= */
const tc=document.createElement("canvas"),tx=tc.getContext("2d",{willReadFrequently:true});
let CW=1000,CH=1000,SC=.05,visW=100,visH=98;
function layout(){
  const asp=innerWidth/innerHeight;
  visH=2*70*Math.tan(THREE.MathUtils.degToRad(35)); visW=visH*asp;
  CW=1000; CH=Math.max(450,Math.min(2200,Math.round(CW/asp))); tc.width=CW; tc.height=CH; SC=visW*.92/CW;
  mat.size=Math.max(.55,visW*.0085+.25);
}
layout();
function wrap(line,maxW){
  const out=[];let cur="";
  for(const ch of line){ if(tx.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch}else cur+=ch }
  out.push(cur);return out;
}
function fit(text,maxFs,hf){
  let fs=maxFs,lines=[];
  for(;fs>=34;fs-=6){
    tx.font="900 "+fs+"px "+FONT; lines=[];
    text.split("\n").forEach(l=>lines.push(...wrap(l,CW*.88)));
    if(lines.length*fs*1.3<=CH*hf)break;
  }
  return {fs,lines};
}
let curText="",curFs=200,curSub=false;
function kickAll(m){for(let i=0;i<N*3;i++)vel[i]+=(Math.random()-.5)*m}
function setText(text,kick,maxFs,hasSub){
  curText=text; curFs=maxFs||200; curSub=!!hasSub; if(kick==null)kick=2.2;
  tx.clearRect(0,0,CW,CH); const {fs,lines}=fit(text,curFs,hasSub?.56:.8);
  tx.font="900 "+fs+"px "+FONT; tx.fillStyle="#fff"; tx.textAlign="center"; tx.textBaseline="middle";
  const lh=fs*1.3,cy=hasSub?CH*.4:CH/2,y0=cy-(lines.length-1)*lh/2; lines.forEach((l,i)=>tx.fillText(l,CW/2,y0+i*lh));
  const d=tx.getImageData(0,0,CW,CH).data, idx=[];
  for(let y=0;y<CH;y+=2)for(let x=0;x<CW;x+=2)if(d[(y*CW+x)*4+3]>128)idx.push(x,y);
  const m=idx.length/2; if(!m)return;
  const perm=new Uint32Array(m); for(let i=0;i<m;i++)perm[i]=i;
  for(let i=m-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=perm[i];perm[i]=perm[j];perm[j]=t}
  const c=new THREE.Color();
  for(let i=0;i<N;i++){
    const j=perm[i%m]; let px=idx[j*2],py=idx[j*2+1];
    if(i>=m){px+=(Math.random()-.5)*4;py+=(Math.random()-.5)*4}
    tgt[i*3]=(px-CW/2)*SC; tgt[i*3+1]=-(py-CH/2)*SC; tgt[i*3+2]=(Math.random()-.5)*2.4;
    grad(py/CH+(Math.random()-.5)*.25,c); tcol[i*3]=c.r;tcol[i*3+1]=c.g;tcol[i*3+2]=c.b;
  }
  kickAll(kick);
}

/* ================= メインループ ================= */
let mx=0,my=0,stage="idle",warpT0=0,warping=false,tNow=0;
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),k=dt*60; tNow+=dt;
  if(warping){const p=Math.min(1,(performance.now()-warpT0)/3200);warpSpeed=1.5+Math.pow(p,3)*200}
  else warpSpeed+=(2.2-warpSpeed)*Math.min(1,dt*2.5);
  updateStars(k);
  pulse*=Math.pow(.86,k); fovX*=Math.pow(.9,k);
  if(pts.visible){
    const damp=Math.pow(.9,k);
    for(let i=0;i<N;i++){
      const j=i*3,s=spr[i]*k,w=Math.sin(tNow*1.8+ph[i])*.004;
      vel[j]=(vel[j]+(tgt[j]-pos[j])*s+w)*damp; vel[j+1]=(vel[j+1]+(tgt[j+1]-pos[j+1])*s+w)*damp; vel[j+2]=(vel[j+2]+(tgt[j+2]-pos[j+2])*s)*damp;
      pos[j]+=vel[j]*k; pos[j+1]+=vel[j+1]*k; pos[j+2]+=vel[j+2]*k;
      col[j]+=(tcol[j]-col[j])*.06; col[j+1]+=(tcol[j+1]-col[j+1])*.06; col[j+2]+=(tcol[j+2]-col[j+2])*.06;
    }
    geo.attributes.position.needsUpdate=true; geo.attributes.color.needsUpdate=true;
  }
  pgroup.scale.setScalar(1+pulse*.03); pgroup.rotation.y=Math.sin(tNow*.6)*.12;
  updateShells(dt); updateFW(dt); updateRings(dt);
  camera.position.x+=(mx*9-camera.position.x)*.04; camera.position.y+=(-my*6-camera.position.y)*.04;
  camera.position.z+=(camZ-camera.position.z)*Math.min(1,dt*3);
  camera.fov=70+fovX+pulse*1.2; camera.updateProjectionMatrix(); camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
loop();

addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  layout(); if(curText)setText(curText,0,curFs,curSub);
});
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});

/* ================= 演出の進行 ================= */
const big=$("big"),flash=$("flash"),hint=$("hint"),sub=$("sub");
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function showBig(t){big.textContent=t;replay(big,"go")}
function shake(){replay(renderer.domElement,"shake")}
function setHint(t){if(t){hint.textContent=t;hint.classList.add("on")}else hint.classList.remove("on")}
let subT=null;
function showSub(t){
  sub.classList.remove("on"); clearTimeout(subT); if(!t)return;
  subT=setTimeout(()=>{sub.textContent=t;sub.classList.add("on")},900);
}
function pointerBurst(e){
  const v=new THREE.Vector3(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,.5).unproject(camera);
  const dir=v.sub(camera.position).normalize(), p=camera.position.clone().add(dir.multiplyScalar(130));
  burst(p.x,p.y,p.z,{n:220,speed:16+Math.random()*6}); punch(2);
}

function startShow(){
  initAudio(); $("start").style.display="none"; stage="count";
  if(AC){$("mute").style.display="block"}
  let n=3;
  (function step(){
    if(n>0){showBig(String(n));sfx.tick();shake();punch(6);n--;setTimeout(step,900)}
    else{showBig("🎂");stage="warp";warping=true;warpT0=performance.now();sfx.riser(3.2);setTimeout(arrive,3250)}
  })();
}
function arrive(){
  warping=false; warpSpeed=60; stage="intro";
  replay(flash,"go"); sfx.boom(); shake(); sfx.chime(); shockwave(0xffffff);
  camera.position.z=190; punch(26); beatStart();
  pts.visible=true; setText("HAPPY\nBIRTHDAY",3.5,230);
  for(let i=0;i<10;i++)setTimeout(()=>randBurst(),i*260);
  setTimeout(()=>{
    setText(NAME+"\nおめでとう！",2.8,230); shockwave(0xff6fa5); punch(10);
    for(let i=0;i<5;i++)setTimeout(()=>randBurst(),i*300);
  },4200);
  setTimeout(()=>{stage="msg";idx=0;showMsg(0);setHint("タップで次へ ▶")},7800);
}
let idx=0;
function showMsg(i){
  const [m,s]=parseMsg(msgList()[i]||"お誕生日おめでとう！");
  setText(m,i?2.6:2.2,170,!!s); showSub(s);
}
function nextMsg(){
  idx++;
  if(idx<msgList().length){
    showMsg(idx); randBurst({n:200}); randBurst({n:200}); sfx.chime(); shockwave(0xff6fa5); punch(12);
  }else finale();
}
function finale(){
  stage="final"; setHint(""); sfx.boom(); shake(); replay(flash,"go"); shockwave(0xffd166); setTimeout(()=>shockwave(0xff6fa5),250); punch(30);
  const fs=unesc(cfg.finalSub||"").trim();
  setText(unesc(cfg.final||"お誕生日おめでとう！"),4,170,!!fs); showSub(fs);
  sfx.melody(); autoFireworks(true); confetti3d(700);
  for(let i=0;i<9;i++)setTimeout(()=>randBurst({n:320}),i*180);
  setTimeout(()=>{setHint("画面をタップすると花火が上がるよ 🎆");$("again").style.display="block"},4000);
}
$("again").onclick=e=>{e.stopPropagation();location.reload()};
$("mute").onclick=e=>{e.stopPropagation();muted=!muted;if(master)master.gain.value=muted?0:.7;$("mute").textContent=muted?"🔇":"🔊"};
$("start").addEventListener("pointerdown",()=>{if(stage==="idle")startShow()});
addEventListener("pointerdown",e=>{
  if(e.target.tagName==="BUTTON"||stage==="idle"||stage==="count"||stage==="warp")return;
  if(stage==="msg"){nextMsg();pointerBurst(e)}
  else pointerBurst(e);
});
})();
</script>
